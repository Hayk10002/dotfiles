[mgr]
prepend_keymap = [
    { on = "<A-Left>", run = "back",    desc = "Back to previous directory" },
    { on = "<A-Right>", run = "forward", desc = "Forward to next directory" },
    { on = "<A-Up>", run = "arrow -5", desc = "Move cursor up by 5 places" },
    { on = "<A-Down>", run = "arrow 5",  desc = "Move cursor down by 5 places" },
    { on = "<S-Up>", run = "seek -5", desc = "Seek up 5 units in the preview" },
    { on = "<S-Down>", run = "seek 5",  desc = "Seek down 5 units in the preview" },
    { on = "u", run = "plugin restore", desc = "Restore last deleted files/folders" },
    { on = [ "d", "d" ], run = "remove", desc = "Trash selected files" },
    { on = [ "d", "u" ], run = "plugin restore -- --interactive", desc = "Restore deleted files/folders (Interactive)" },
    { on = [ "d", "U" ], run = "plugin restore -- --interactive --interactive-overwrite", desc = "Restore deleted files/folders (Interactive overwrite)" },
    { on = "<C-p>", run = "shell --block -- echo %s", desc = "Output selected files to stdout" },
    { on = [ "C" ], run = "plugin ouch", desc = "Compress with ouch (zip)" },
]
